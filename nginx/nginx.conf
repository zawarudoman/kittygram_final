server {
    listen 80;
    server_tokens off;

    location /api/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:9000/api/;
    }

    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:9000/admin/;
    }

    location /media/ {
        alias /app/media/;
        try_files $uri $uri/ =404;
    }

    # Для Django статики (REST Framework, админка)
    location /static/ {
        alias /staticfiles/static/;
        try_files $uri $uri/ =404;
    }

    location /static/admin/ {
        alias /staticfiles/admin/;
        try_files $uri $uri/ =404;
    }

    location /static/ {
        alias /staticfiles/;
        try_files $uri $uri/ =404;
    }

    # Для фронтенда (React)
    location / {
        alias /staticfiles/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
server {
    listen 80;
    server_tokens off;

    location /api/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:9000/api/;
    }

    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:9000/admin/;
    }

    location /media/ {
        alias /app/media/;
        try_files $uri $uri/ =404;
    }

    # Статика Django (admin и rest_framework)
    location /static/admin/ {
        alias /staticfiles/admin/;
        try_files $uri $uri/ =404;
    }

    location /static/rest_framework/ {
        alias /staticfiles/rest_framework/;
        try_files $uri $uri/ =404;
    }

    # Статика фронтенда (React) - ВАЖНО!
    location /static/ {
        alias /staticfiles/static/;
        try_files $uri $uri/ =404;
    }

    # Главная страница и SPA роутинг
    location / {
        root /staticfiles/static;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}